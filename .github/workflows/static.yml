name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build site
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          NITRO_PRESET: "static"
      - name: Prepare files
        run: |
          OUT=$(dirname "$(find dist .output -name index.html -not -path '*/node_modules/*' | head -1)")
          echo "Using $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT=$OUT" >> $GITHUB_ENV
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT }}
      - id: deployment
        uses: actions/deploy-pages@v4
